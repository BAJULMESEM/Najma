<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">TEXT WORLD</div>
        <h1 id="pageTitle">Beranda</h1>
      </div>
      <button id="homeBtn" class="small-btn" type="button">⌂ Beranda</button>
    </header>

    <main>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty hidden">Belum ada folder atau teks di sini.</div>
    </main>

    <div id="reader" class="reader hidden" aria-modal="true" role="dialog">
      <div class="paper">
        <button id="closeReader" class="close-btn" type="button" aria-label="Tutup">×</button>
        <div class="paper-label">DOCUMENT</div>
        <h2 id="readerTitle"></h2>
        <pre id="readerText"></pre>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
