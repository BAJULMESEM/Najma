<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">TEXT WORLD</div>
        <h1 id="pageTitle">Beranda</h1>
      </div>
      <button id="homeBtn" class="small-btn" type="button">⌂ Beranda</button>
    </header>
    <main>
      <div id="breadcrumb" class="breadcrumb"></div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty hidden">Belum ada folder atau teks di sini.</div>
    </main>
    <div id="reader" class="reader hidden" aria-modal="true" role="dialog" aria-labelledby="readerTitle">
      <section class="paper" id="paper">
        <button id="closeReader" class="close-btn" type="button" aria-label="Tutup">×</button>
        <div class="paper-label">DOCUMENT</div>
        <h2 id="readerTitle"></h2>
        <details class="reader-settings" id="readerSettings">
          <summary><span aria-hidden="true">🎨</span> Pilih warna dokumen</summary>
          <div class="settings-body">
            <fieldset class="color-group">
              <legend>Warna background</legend>
              <div class="preset-list" id="backgroundPresets" aria-label="Preset warna background">
                <button type="button" class="color-preset" data-color="#FFFFFF" style="--swatch:#FFFFFF" aria-label="Background putih" title="Putih"><span></span>Putih</button>
                <button type="button" class="color-preset" data-color="#F4EDDA" style="--swatch:#F4EDDA" aria-label="Background krem" title="Krem"><span></span>Krem</button>
                <button type="button" class="color-preset" data-color="#E8D3A3" style="--swatch:#E8D3A3" aria-label="Background kuning kuno" title="Kuning kuno"><span></span>Kuning kuno</button>
                <button type="button" class="color-preset" data-color="#000000" style="--swatch:#000000" aria-label="Background hitam" title="Hitam"><span></span>Hitam</button>
              </div>
              <div class="custom-color-row">
                <label for="backgroundColorPicker">Custom color</label>
                <input id="backgroundColorPicker" type="color" value="#F4EDDA" aria-label="Pilih warna background khusus">
                <input id="backgroundHex" class="hex-input" type="text" value="#F4EDDA" maxlength="7" spellcheck="false" aria-label="Kode HEX background" autocomplete="off">
              </div>
            </fieldset>
            <fieldset class="color-group">
              <legend>Warna teks</legend>
              <div class="preset-list" id="textPresets" aria-label="Preset warna teks">
                <button type="button" class="color-preset" data-color="#29251D" style="--swatch:#29251D" aria-label="Teks hitam" title="Hitam"><span></span>Hitam</button>
                <button type="button" class="color-preset" data-color="#FFFFFF" style="--swatch:#FFFFFF" aria-label="Teks putih" title="Putih"><span></span>Putih</button>
                <button type="button" class="color-preset" data-color="#F5D76E" style="--swatch:#F5D76E" aria-label="Teks kuning" title="Kuning"><span></span>Kuning</button>
                <button type="button" class="color-preset" data-color="#704214" style="--swatch:#704214" aria-label="Teks sepia" title="Sepia"><span></span>Sepia</button>
              </div>
              <div class="custom-color-row">
                <label for="textColorPicker">Custom color</label>
                <input id="textColorPicker" type="color" value="#29251D" aria-label="Pilih warna teks khusus">
                <input id="textHex" class="hex-input" type="text" value="#29251D" maxlength="7" spellcheck="false" aria-label="Kode HEX teks" autocomplete="off">
              </div>
            </fieldset>
            <div class="settings-actions">
              <button id="resetReaderColors" type="button" class="reset-colors-btn">Reset warna</button>
              <span id="colorSaveStatus" class="save-status" role="status" aria-live="polite">Tersimpan otomatis di perangkat ini</span>
            </div>
          </div>
        </details>
        <pre id="readerText"></pre>
      </section>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
